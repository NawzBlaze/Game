name: Verify web release candidate
on:
  push:
    branches: [main, arena/fcb06d04-game]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Preserve verification results (not production approval)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-release-candidate
          path: |
            dist/qa-report.json
            dist/SHA256SUMS.txt
            dist/*.zip
          retention-days: 14
