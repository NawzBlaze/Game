name: Android build and emulator tests
on:
  workflow_dispatch:
  push:
    branches: [arena/fcb06d04-game]
    paths: ['android/**', 'web/**', 'tools/build_release.py', 'tools/check_android_size.py', 'tests/test_android_size.py', 'tools/run_android_emulator_tests.py', 'tests/test_android_emulator_runner.py', 'docs/release-assets.json', 'package.json', '.github/workflows/android-build-device.yml']
permissions:
  contents: read
concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install SDK using the runner's provisioned tools
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -f "$SDK/platforms/android-36/android.jar" ] && [ -x "$SDK/build-tools/36.0.0/apksigner" ]; then
            echo 'Using preinstalled SDK 36 and build-tools 36.0.0' | tee sdk-setup.log
          else
            MANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
            test -n "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-36' 'build-tools;36.0.0' 2>&1 | tee sdk-setup.log
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Check Android safety and size-gate tooling
        run: python3 -m unittest discover -s tests -p 'test_android_*.py' -v
      - name: Compile, lint and simulate native framework APIs
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon -PtestApi=29,33,36 testDebugUnitTest lintDebug verifyDebugSize assembleDebugAndroidTest verifyReleaseSize 2>&1 | tee ../android-build.log
      - name: Expose bounded build failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          for name in ['sdk-setup.log','android-build.log']:
              p=Path(name)
              if p.exists():
                  text=p.read_text(errors='replace')[-12000:]
                  text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::error title='+name+'::'+text)
          PYCODE
      - name: Record candidate identities
        run: |
          mkdir -p dist/android-candidates
          cp android/app/build/outputs/apk/debug/*.apk dist/android-candidates/
          cp android/app/build/outputs/apk/androidTest/debug/*.apk dist/android-candidates/
          cp android/app/build/outputs/apk/release/*unsigned.apk dist/android-candidates/
          cp android/app/build/outputs/bundle/release/*.aab dist/android-candidates/
          git rev-parse HEAD > dist/android-candidates/SOURCE_COMMIT.txt
          cp dist/SHA256SUMS.txt dist/android-candidates/WEB_SHA256SUMS.txt
          echo 'Debug APK: clean test devices only. Release APK and AAB: unsigned, NOT store-ready. No physical-device or signing approval.' > dist/android-candidates/READ_ME_FIRST.txt
          cd dist/android-candidates
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-and-debug-candidates
          path: dist/android-candidates/
          retention-days: 14
      - name: Prepare a single mobile preview APK download
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          mkdir -p dist/mobile-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/mobile-apk/little-parcel-crew-$VERSION-preview.apk"
          cp dist/android-candidates/SOURCE_COMMIT.txt dist/mobile-apk/
          echo 'Test-signed preview APK. Clean test device only. Do not uninstall or overwrite the affected game. Not a signed production/store release.' > dist/mobile-apk/READ_ME_FIRST.txt
          cd dist/mobile-apk
          sha256sum *.apk > SHA256SUMS.txt
          echo "::notice title=Mobile preview APK SHA256::$(cat SHA256SUMS.txt)"
          echo "::notice title=Mobile preview APK bytes::$(stat -c '%s' little-parcel-crew-*-preview.apk)"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-preview
          path: dist/mobile-apk/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: |
            sdk-setup.log
            android-build.log
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned-and-debug-candidates
          path: candidates
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test exact debug candidate in disposable offline emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/run_android_emulator_tests.py --candidates candidates --output emulator-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-api-${{ matrix.api }}-evidence
          path: emulator-evidence/
          retention-days: 14
# Installs ONLY in a freshly created CI emulator. Never targets a user's phone.
# No release signing credentials or Play publishing permissions are used.
