name: Android build and emulator tests
on:
  workflow_dispatch:
  push:
    branches: [arena/fcb06d04-game]
    paths: ['android/**', 'web/**', 'tools/build_release.py', 'docs/release-assets.json', 'package.json', '.github/workflows/android-build-device.yml']
permissions:
  contents: read
concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile, lint and simulate native framework APIs
        working-directory: android
        run: |
          ./gradlew --no-daemon -PtestApi=29,33,36 testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease bundleRelease
      - name: Record candidate identities
        run: |
          mkdir -p dist/android-candidates
          cp android/app/build/outputs/apk/debug/*.apk dist/android-candidates/
          cp android/app/build/outputs/apk/androidTest/debug/*.apk dist/android-candidates/
          cp android/app/build/outputs/apk/release/*unsigned.apk dist/android-candidates/
          cp android/app/build/outputs/bundle/release/*.aab dist/android-candidates/
          git rev-parse HEAD > dist/android-candidates/SOURCE_COMMIT.txt
          cp dist/SHA256SUMS.txt dist/android-candidates/WEB_SHA256SUMS.txt
          echo 'Debug APK: clean test devices only. Release APK and AAB: unsigned, NOT store-ready. No physical-device or signing approval.' > dist/android-candidates/READ_ME_FIRST.txt
          cd dist/android-candidates
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-and-debug-candidates
          path: dist/android-candidates/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [33, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-unsigned-and-debug-candidates
          path: candidates
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test exact debug candidate in disposable offline emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/run_android_emulator_tests.py --candidates candidates --output emulator-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-api-${{ matrix.api }}-evidence
          path: emulator-evidence/
          retention-days: 14
# Installs ONLY in a freshly created CI emulator. Never targets a user's phone.
# No release signing credentials or Play publishing permissions are used.
